<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<title>Contact | Siabi Studio</title>
<style>
  :root{
    --paper:#dedfda;
    --ink:#0a0a0a;
    --accent:#e77bd5;
    --muted:#8a847a;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:'Fraunces',serif;
  }
  .grain{
    position:fixed; inset:0; pointer-events:none; opacity:.18; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.04  0 0 0 0 0.04  0 0 0 0 0.04  0 0 0 0.6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  header{
    position:relative; z-index:1; padding:22px clamp(20px,3vw,40px) 0;
    display:flex; align-items:flex-start; justify-content:space-between; gap:24px;
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.22em;
    text-transform:uppercase;
  }
  header a{ color:var(--ink); text-decoration:none; border-bottom:1px solid currentColor; }
  .logo{ height:clamp(36px,4.5vw,56px); width:auto; mix-blend-mode:multiply; }
  main{
    position:relative; z-index:1; min-height:calc(100vh - 80px);
    display:grid; grid-template-columns:minmax(280px,.78fr) minmax(320px,.72fr);
    gap:clamp(28px,6vw,90px); align-items:center;
    padding:clamp(34px,5vw,70px) clamp(20px,6vw,90px) clamp(36px,6vw,72px);
  }
  h1{
    margin:0; font-weight:300; font-style:italic;
    font-size:clamp(52px,9vw,126px); line-height:.92;
    font-variation-settings:"SOFT" 80;
  }
  .intro{
    margin-top:18px; max-width:480px; color:var(--muted);
    font-family:'JetBrains Mono',monospace; font-size:10.5px; line-height:1.8;
    letter-spacing:.12em; text-transform:uppercase;
  }
  form{
    border-top:1.5px solid var(--ink); padding-top:24px;
    display:grid; gap:14px;
  }
  label{
    display:grid; gap:7px; font-family:'JetBrains Mono',monospace;
    font-size:9.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted);
  }
  input,textarea{
    width:100%; border:1px solid var(--ink); border-radius:0; background:transparent;
    color:var(--ink); padding:13px 12px; font:16px 'Fraunces',serif;
  }
  textarea{ min-height:150px; resize:vertical; }
  input:focus,textarea:focus{ outline:2px solid var(--accent); outline-offset:2px; }
  .hidden-field{ display:none; }
  button{
    border:1px solid var(--ink); background:var(--ink); color:var(--paper);
    padding:14px 16px; cursor:pointer;
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.2em;
    text-transform:uppercase; transition:background .18s ease, border-color .18s ease, color .18s ease;
  }
  button:hover{ background:var(--accent); border-color:var(--accent); color:var(--ink); }
  .note{
    margin:0; color:var(--muted); font-family:'JetBrains Mono',monospace;
    font-size:10px; letter-spacing:.12em; line-height:1.7; text-transform:uppercase;
  }
  .thanks{ display:none; color:var(--ink); }
  .thanks.show{ display:block; }
  @media (max-width:820px){
    header span{ display:none; }
    main{ grid-template-columns:1fr; align-items:start; }
  }
</style>
</head>
<body>
<div class="grain"></div>
<header>
  <a href="/">Back to index</a>
  <img class="logo" src="/assets/logo.png" alt="Siabi Studio">
  <span>rosa@siabi.studio</span>
</header>

<main>
  <section>
    <h1>Contact</h1>
    <p class="intro">Send a note about a print, original work, commission, press, or studio visit.</p>
  </section>
  <section>
    <form action="https://formsubmit.co/rosa@siabi.studio" method="POST">
      <input type="hidden" name="_subject" id="form-subject" value="Siabi Studio enquiry">
      <input type="hidden" name="_next" id="form-next" value="">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <input type="text" name="_honey" class="hidden-field" tabindex="-1" autocomplete="off">

      <p class="note thanks" id="thanks-message">Thank you. Your message has been sent.</p>
      <label>
        Name
        <input name="name" type="text" autocomplete="name" required>
      </label>
      <label>
        Email
        <input name="email" type="email" autocomplete="email" required>
      </label>
      <label>
        Subject
        <input name="subject" id="visible-subject" type="text" value="Siabi Studio enquiry" required>
      </label>
      <label>
        Message
        <textarea name="message" required></textarea>
      </label>
      <button type="submit">Send enquiry</button>
      <p class="note">Your message is forwarded to rosa@siabi.studio.</p>
    </form>
  </section>
</main>

<script type="module" src="./contact.js"></script>
</body>
</html>
