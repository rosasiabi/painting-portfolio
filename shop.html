<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<title>Artwork Enquiry | Siabi Studio</title>
<style>
  :root{
    --paper:#dedfda;
    --ink:#0a0a0a;
    --ink-2:#2a2620;
    --accent:#e77bd5;
    --muted:#8a847a;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:'Fraunces',serif;
  }
  .grain{
    position:fixed; inset:0; pointer-events:none; opacity:.18; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.04  0 0 0 0 0.04  0 0 0 0 0.04  0 0 0 0.6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  header{
    position:relative; z-index:1; padding:22px clamp(20px,3vw,40px) 0;
    display:flex; align-items:flex-start; justify-content:space-between; gap:24px;
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.22em;
    text-transform:uppercase;
  }
  header a{ color:var(--ink); text-decoration:none; border-bottom:1px solid currentColor; }
  .logo{ height:clamp(36px,4.5vw,56px); width:auto; mix-blend-mode:multiply; }
  main{
    position:relative; z-index:1; min-height:calc(100vh - 80px);
    display:grid; grid-template-columns:minmax(280px, 0.92fr) minmax(300px, 0.78fr);
    gap:clamp(28px,5vw,76px); align-items:center;
    padding:clamp(28px,4vw,56px) clamp(20px,6vw,90px) clamp(36px,6vw,72px);
  }
  .artwork{
    display:flex; align-items:center; justify-content:center; min-height:62vh;
  }
  .artwork img{
    max-width:100%; max-height:72vh; object-fit:contain;
    box-shadow:0 22px 70px rgba(10,10,10,.22);
  }
  .meta{
    max-width:520px; border-top:1.5px solid var(--ink); padding-top:24px;
  }
  .kicker{
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.28em;
    text-transform:uppercase; color:var(--muted); margin-bottom:14px;
  }
  h1{
    margin:0 0 18px; font-weight:300; font-style:italic;
    font-size:clamp(42px,7vw,86px); line-height:.96;
    font-variation-settings:"SOFT" 80;
  }
  dl{
    display:grid; grid-template-columns:72px 1fr; gap:8px 14px;
    margin:0 0 24px; font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:.06em; line-height:1.8;
  }
  dt{ color:var(--muted); text-transform:uppercase; font-size:9.5px; letter-spacing:.22em; }
  dd{ margin:0; }
  .choices{ display:grid; gap:10px; margin-top:18px; }
  .enquire-button{
    width:100%; padding:14px 16px; border:1px solid var(--ink);
    background:var(--ink); color:var(--paper); text-align:center; text-decoration:none;
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.2em;
    text-transform:uppercase; transition:background .18s ease, border-color .18s ease, color .18s ease;
  }
  .enquire-button:hover{ background:var(--accent); border-color:var(--accent); color:var(--ink); }
  .note{
    margin-top:18px; color:var(--muted); font-family:'JetBrains Mono',monospace;
    font-size:10px; letter-spacing:.12em; line-height:1.7; text-transform:uppercase;
  }
  @media (max-width: 820px){
    header{ align-items:center; }
    header span{ display:none; }
    main{ grid-template-columns:1fr; align-items:start; padding-top:26px; }
    .artwork{ min-height:auto; }
    .artwork img{ max-height:50vh; }
  }
</style>
</head>
<body>
<div class="grain"></div>
<header>
  <a href="/">Back to index</a>
  <img class="logo" src="/assets/logo.png" alt="Siabi Studio">
  <span>Studio enquiry</span>
</header>

<main>
  <section class="artwork">
    <img id="art-image" src="" alt="">
  </section>
  <section class="meta">
    <div class="kicker" id="art-medium">Artwork</div>
    <h1 id="art-title">Artwork</h1>
    <dl>
      <dt>Size</dt><dd id="art-size">-</dd>
      <dt>Edition</dt><dd id="art-edition">20/20</dd>
      <dt>Status</dt><dd id="art-status">-</dd>
      <dt>Format</dt><dd id="art-format">Print enquiry</dd>
    </dl>
    <div class="choices">
      <a class="enquire-button" id="enquire-artwork" href="/contact.html">Enquire about this work</a>
    </div>
    <p class="note" id="enquiry-note">The enquiry form will include this artwork in the subject so Rosa knows which piece you are asking about.</p>
  </section>
</main>

<script type="module" src="./shop.js"></script>
</body>
</html>
